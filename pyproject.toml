[project]
name = "lean4-lens"
version = "0.1.0"
description = "Analysis tools for a Lean 4 project: review cone, dependency graph, tactic survey, build times"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lean4-lens = "lean4_lens.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lean4_lens"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
