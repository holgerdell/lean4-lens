# The supported Python versions — 3.15 is still a release candidate, so it is
# early warning rather than support. Run the same way locally and in CI:
#   tox           every version
#   tox -e py311  one of them
# tox-uv provisions the interpreters through uv, so no pyenv/deadsnakes needed.
[tox]
env_list = py311, py312, py313, py314, py315
requires =
    tox>=4.21
    tox-uv>=1.13

[testenv]
runner = uv-venv-lock-runner
dependency_groups = dev
# Explicit, so a machine-level UV_PYTHON_PREFERENCE=only-system cannot leave the
# matrix unable to find 3.11-3.13: prefer a system interpreter, download one if
# there is none.
uv_python_preference = system
commands = pytest {posargs}
